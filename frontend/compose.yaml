name: private-speech-studio-frontend
services:
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: private-speech-studio-frontend:local
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      TTS_UPSTREAM_URL: ${TTS_UPSTREAM_URL:?Set TTS_UPSTREAM_URL to the authorized speech service origin}
      TTS_API_KEY_FILE: /run/secrets/tts_api_key
    secrets:
      - source: tts_api_key
        target: tts_api_key

secrets:
  tts_api_key:
    file: ${TTS_API_KEY_FILE:?Set TTS_API_KEY_FILE to the protected backend credential file}
