<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f5f2">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <title>Private Speech Studio</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <a class="wordmark" href="/" aria-label="Private Speech Studio home">
          <span class="wordmark-icon" aria-hidden="true">◖</span>
          <span>STUDIO <span class="wordmark-light">/ SPEECH</span></span>
        </a>
        <span class="privacy-label"><span class="privacy-dot"></span> PRIVATE BY DESIGN</span>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">LOCAL TEXT TO SPEECH</p>
        <h1 id="page-title">Give your words<br> a <em>voice.</em></h1>
        <p class="intro-copy">Turn text into speech with your private macOS voice service. Nothing is saved here.</p>
      </section>

      <section class="studio-card" aria-label="Speech generator">
        <form id="speech-form">
          <div class="field-heading">
            <label for="speech-text">YOUR TEXT</label>
            <div class="field-actions">
              <span id="character-count" class="character-count">0 / 5,000</span>
              <button id="paste-text" class="clear-text-button" type="button" aria-label="Paste from clipboard" title="Paste from clipboard">Paste</button>
              <button id="clear-text" class="clear-text-button" type="button" disabled>Clear</button>
            </div>
          </div>
          <textarea id="speech-text" name="input" maxlength="5000" placeholder="Paste or type something you’d like to hear..." required></textarea>

          <div class="options-grid">
            <div class="option">
              <label for="language">LANGUAGE</label>
              <select id="language" name="language">
                <option value="">Auto-detect</option>
                <option value="de-DE">German</option>
                <option value="en-US">English (US)</option>
                <option value="en-GB">English (UK)</option>
              </select>
            </div>
            <div class="option">
              <label for="format">AUDIO FORMAT</label>
              <select id="format" name="response_format">
                <option value="mp3">MP3</option>
                <option value="wav">WAV</option>
              </select>
            </div>
          </div>

          <div class="speed-option">
            <div class="speed-heading">
              <label for="speed">SPEAKING SPEED</label>
              <output id="speed-value" for="speed">1.0×</output>
            </div>
            <input id="speed" name="speed" type="range" min="0.5" max="2" step="0.1" value="1">
            <div class="range-labels"><span>0.5×</span><span>2.0×</span></div>
          </div>

          <button id="generate" class="generate-button" type="submit">
            <span>Generate speech</span><span class="button-arrow" aria-hidden="true">↗</span>
          </button>
        </form>

        <section id="result" class="result" aria-live="polite" hidden>
          <div class="result-heading">
            <div>
              <p class="eyebrow">YOUR AUDIO</p>
              <h2>Ready to listen.</h2>
            </div>
            <a id="download" class="download-button" download="speech.mp3">Download <span aria-hidden="true">↓</span></a>
          </div>
          <audio id="audio-player" controls preload="none"></audio>
        </section>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <footer class="page-footer">
        <span>YOUR TEXT STAYS BETWEEN YOU AND YOUR SERVICE.</span>
        <span id="service-status" class="service-status"><span class="status-dot"></span> CHECKING SERVICE</span>
      </footer>
    </main>
  </body>
</html>
